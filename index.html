<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0e17" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="KeyFlow" />
  <title>KeyFlow — 5-Second Horizon Virtual Piano</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="appShell">
    <!-- ==================== TOP BAR ==================== -->
    <header class="top-bar">
      <div class="top-left">
        <span class="song-title-display" id="songTitleHeader">Let It Be - The Beatles</span>

        <select id="songSelect" class="ui-select" aria-label="Select Song">
          <option value="let_it_be">Let It Be - The Beatles</option>
          <option value="imagine">Imagine - John Lennon</option>
          <option value="clair_de_lune">Clair de Lune - Debussy</option>
          <option value="gymnopedie">Gymnopédie No. 1 - Satie</option>
          <option value="pyramid_song">Pyramid Song - Radiohead</option>
        </select>

        <label for="midiInput" class="ui-btn ui-btn-accent" title="Load any .mid or .midi song file">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/>
          </svg>
          <span>Open .MID</span>
        </label>
        <input id="midiInput" type="file" accept=".mid,.midi" style="display:none;" />
      </div>

      <!-- Center Wait Mode Prompt -->
      <div id="waitBanner">
        <span class="pulse-dot"></span>
        <span id="waitBannerText">Wait Mode: Play highlighted keys</span>
      </div>

      <!-- Right Controls: Live MIDI Status, Range Mode & Settings Icon -->
      <div class="top-right">
        <div id="midiStatusBadge" class="midi-status-badge" title="Connect a USB or Bluetooth MIDI keyboard">
          <span id="midiStatusDot" class="midi-status-dot"></span>
          <span id="midiStatusText">MIDI</span>
        </div>

        <select id="rangeModeSelect" class="ui-select" title="Dynamic Virtual Piano Range">
          <option value="auto">Auto-Scale Range</option>
          <option value="compact">Min 2 Octaves</option>
          <option value="full88">Full 88 Keys</option>
        </select>

        <button id="settingsToggleBtn" class="ui-btn icon-btn" title="Lookahead & Practice Settings" aria-label="Settings">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- Settings Popover -->
    <div id="settingsPopover">
      <div class="popover-title">
        <span>Display & Practice</span>
        <span id="activeRangeBadge" style="font-size:11px; color:#38bdf8; font-family:monospace;">G2–F5</span>
      </div>

      <div style="display:flex; flex-direction:column; gap:6px;">
        <div style="display:flex; justify-content:space-between; font-size:12px; color:#cbd5e1;">
          <span>Note Lookahead Horizon</span>
          <strong id="horizonLabel" style="color:#34d399; font-family:monospace;">5.0s</strong>
        </div>
        <div class="seg-group">
          <button class="seg-btn horizon-opt" data-sec="3">3.0s</button>
          <button class="seg-btn horizon-opt active" data-sec="5">5.0s (iPad)</button>
          <button class="seg-btn horizon-opt" data-sec="7">7.0s</button>
        </div>
      </div>

      <div class="hud-divider"></div>

      <div class="hud-row" style="font-size:12px;">
        <span>Show Measure &amp; Beat Grid</span>
        <button id="measureGridSwitch" class="switch-btn active-blue" aria-label="Toggle Measure and Beat Grid">
          <span class="switch-thumb"></span>
        </button>
      </div>

      <div class="hud-row" style="font-size:12px;">
        <span>Show All Key Names</span>
        <button id="allKeyLabelsSwitch" class="switch-btn" aria-label="Toggle All Key Labels">
          <span class="switch-thumb"></span>
        </button>
      </div>

      <div class="hud-row" style="font-size:12px;">
        <span>A–B Loop Speed Ramp (+5%)</span>
        <button id="speedRampSwitch" class="switch-btn" aria-label="Toggle Loop Speed Ramp">
          <span class="switch-thumb"></span>
        </button>
      </div>

      <div class="hud-divider"></div>

      <button id="resplitHandsBtn" class="ui-btn ui-btn-accent popover-action-btn" title="Re-run smart L/R voice separation using 10th hand-span constraints">
        <span>Re-split Hands (Smart AI)</span>
      </button>
    </div>

    <!-- Thin Top Song Progress Strip -->
    <div class="top-progress-rail">
      <div id="topProgressFill"></div>
    </div>

    <!-- ==================== MAIN STAGE (5s RUNWAY + PIANO) ==================== -->
    <main class="stage-container" id="stageContainer">
      <!-- Floating Left Practice & Sound HUD (Matches Approved iPad UI) -->
      <aside class="hud-panel">
        <!-- Speed Row -->
        <div class="hud-row">
          <div class="hud-label">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" style="color:#cbd5e1;">
              <path d="M8 5v14l11-7z"/>
            </svg>
            <span>Speed</span>
          </div>
          <button id="speedBtn" class="speed-pill" title="Click to cycle playback speed">1.0x</button>
        </div>

        <!-- Wait Mode Row -->
        <div class="hud-row">
          <div class="hud-label">
            <span id="waitOrb" class="status-orb orb-blue orb-dim"></span>
            <span>Wait Mode</span>
          </div>
          <button id="waitSwitch" class="switch-btn" role="switch" aria-checked="false" title="Pause falling notes at NOW line until you play them">
            <span class="switch-thumb"></span>
          </button>
        </div>

        <!-- Hand Isolation Row -->
        <div class="hud-row">
          <div class="hud-label">
            <span id="handOrb" class="status-orb orb-green orb-dim"></span>
            <span>Hand Isolation</span>
          </div>
          <button id="handIsoSwitch" class="switch-btn" role="switch" aria-checked="false" title="Toggle Hand Isolation">
            <span class="switch-thumb"></span>
          </button>
        </div>

        <div class="hand-pills-row">
          <button id="leftHandBtn" class="hand-pill hand-pill-l inactive" title="Toggle Left Hand (Blue)">L</button>
          <button id="rightHandBtn" class="hand-pill hand-pill-r inactive" title="Toggle Right Hand (Green)">R</button>
        </div>

        <div class="hud-divider"></div>

        <!-- Sound Preset Selector (Matching iPad Mockup) -->
        <button id="soundCollapseBtn" class="sound-header-btn">
          <span>Sound</span>
          <svg id="soundChevron" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" style="color:#94a3b8; transition: transform 0.2s;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/>
          </svg>
        </button>

        <div id="soundSectionBody" style="display:flex; flex-direction:column; gap:9px;">
          <div class="sound-list-box">
            <button class="sound-option-btn selected" data-preset="acoustic_grand">
              <span class="check-mark">✓</span>
              <span>Acoustic Grand Piano</span>
            </button>
            <button class="sound-option-btn" data-preset="mellow_felt">
              <span class="check-mark">✓</span>
              <span>Mellow Felt Grand</span>
            </button>
            <button class="sound-option-btn" data-preset="warm_upright">
              <span class="check-mark">✓</span>
              <span>Warm Vintage Upright</span>
            </button>
            <button class="sound-option-btn" data-preset="electric_piano">
              <span class="check-mark">✓</span>
              <span>Warm Electric Piano</span>
            </button>
          </div>

          <div class="warmth-box">
            <div class="warmth-header">
              <span>Felt Softness / Warmth</span>
              <span id="warmthLabel" class="warmth-val">24%</span>
            </div>
            <input id="warmthSlider" type="range" min="0" max="100" value="24" class="range-slider" />
          </div>

          <div class="sample-caption">
            <span id="engineStatusText">Sample Quality: High (Default)</span>
          </div>
        </div>
      </aside>

      <!-- High-DPI Canvas for 5-Second Runway + Auto-Scaled Virtual Piano -->
      <canvas id="pianoCanvas" width="960" height="540"></canvas>
    </main>

    <!-- ==================== BOTTOM TRANSPORT & A-B LOOP BAR ==================== -->
    <footer class="bottom-bar">
      <div class="transport-left">
        <button id="restartBtn" class="ui-btn icon-btn" title="Restart from Beginning (or Loop Start)" aria-label="Restart">
          <svg width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/>
          </svg>
        </button>

        <button id="playPauseBtn" class="play-main-btn" title="Play / Pause (Spacebar)" aria-label="Play or Pause">
          <svg id="playSvg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="margin-left:2px;">
            <path d="M8 5v14l11-7z"/>
          </svg>
          <svg id="pauseSvg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor" style="display:none;">
            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
          </svg>
        </button>

        <div class="time-readout">
          <strong id="curTimeText">0:00</strong> / <span id="totTimeText">0:30</span>
        </div>
      </div>

      <!-- Interactive Timeline & A-B Loop -->
      <div class="timeline-wrapper">
        <button id="abLoopBtn" class="loop-toggle-btn" title="Toggle A–B Section Loop">A–B Loop</button>
        <button id="loopRampBtn" class="loop-ramp-btn" title="Auto-increment loop tempo by +5% after each clean pass">+5% Ramp</button>

        <div id="timelineTrack" class="timeline-interactive">
          <div class="timeline-rail">
            <div id="timelineFill"></div>
          </div>

          <div id="abLoopBox" style="left:15%; width:35%;">A–B LOOP</div>
          <div id="loopHandleA" class="loop-handle" style="left:15%;" title="Drag Loop Start A">‹</div>
          <div id="loopHandleB" class="loop-handle" style="left:50%;" title="Drag Loop End B">›</div>
          <div id="playheadThumb" style="left:0%;"></div>
        </div>
      </div>

      <div class="transport-right">
        <button id="muteBtn" class="ui-btn icon-btn" title="Mute / Unmute Piano Audio" aria-label="Mute">
          <svg id="volOnSvg" width="16" height="16" fill="none" stroke="#34d399" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15z"/>
          </svg>
          <svg id="volOffSvg" width="16" height="16" fill="none" stroke="#f87171" stroke-width="2" viewBox="0 0 24 24" style="display:none;">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5.586 15H4a1 1 0 01-1-1v-4a1 1 0 011-1h1.586l4.707-4.707C10.923 3.663 12 4.109 12 5v14c0 .891-1.077 1.337-1.707.707L5.586 15zM17 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2"/>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <!-- Modular Application Scripts (Zero Build Step Required) -->
  <script src="js/songs.js"></script>
  <script src="js/midi-parser.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
